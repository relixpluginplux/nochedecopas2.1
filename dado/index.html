<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Dado 3D</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    color: white;
    position: relative;
    overflow: hidden;
}

/* Partículas */
.particles {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    z-index: 0;
    pointer-events: none;
}

.particle {
    position: absolute;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 50%;
    animation: float 18s infinite ease-in-out;
}

.particle:nth-child(1) { width: 60px; height: 60px; left: 10%; animation-delay: 0s; }
.particle:nth-child(2) { width: 80px; height: 80px; left: 35%; animation-delay: 3s; }
.particle:nth-child(3) { width: 50px; height: 50px; left: 60%; animation-delay: 6s; }
.particle:nth-child(4) { width: 70px; height: 70px; left: 85%; animation-delay: 2s; }

@keyframes float {
    0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
    10% { opacity: 0.4; }
    90% { opacity: 0.4; }
    100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
}

/* Control de audio */
.audio-control {
    position: fixed;
    top: 15px;
    right: 15px;
    z-index: 1000;
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(10px);
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    width: 45px;
    height: 45px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
}

.audio-control:active {
    transform: scale(0.95);
}

.volver-btn {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 1000;
    padding: 0.8rem 1.3rem;
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(10px);
    color: white;
    font-size: 1rem;
    font-weight: 600;
    border-radius: 15px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    transition: all 0.3s ease;
    text-decoration: none;
}

.volver-btn:active {
    transform: scale(0.95);
}

.container {
    max-width: 500px;
    width: 100%;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(20px);
    border-radius: 30px;
    padding: 2.5rem 1.5rem;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.2);
    position: relative;
    z-index: 1;
    text-align: center;
}

h1 {
    font-size: 2.5rem;
    margin-bottom: 2rem;
    color: #ffcc00;
    text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    font-weight: 700;
}

#result {
    font-size: 4rem;
    font-weight: 700;
    color: #ffcc00;
    text-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    margin-bottom: 2rem;
    padding: 1.5rem;
    background: rgba(255, 204, 0, 0.2);
    border-radius: 20px;
    min-height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
}

#ui_dado {
    margin: 2rem auto;
    position: relative;
    width: 100%;
    perspective: 1200px;
}

#platform {
    margin: 0 auto;
    height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
}

#platform.playing {
    transform-style: preserve-3d;
    animation: roll 1s linear;
}

#platform.stop > #dice,
#platform.stop {
    animation-play-state: paused;
}

#dice {
    position: relative;
    width: 120px;
    height: 120px;
    transform-style: preserve-3d;
    transform: rotateX(15deg) rotateY(10deg) rotateZ(-15deg);
    cursor: pointer;
    transition: transform 0.3s ease;
}

#dice:hover {
    transform: rotateX(15deg) rotateY(10deg) rotateZ(-15deg) scale(1.05);
}

#platform.playing > #dice {
    animation: spin 1.4s infinite linear;
}

.side {
    position: absolute;
    width: 120px;
    height: 120px;
    background: linear-gradient(135deg, #fff, #f0f0f0);
    box-shadow: inset 0 0 50px rgba(204, 204, 204, 0.8),
                0 0 30px rgba(0, 0, 0, 0.3);
    border-radius: 20px;
    border: 2px solid rgba(255, 255, 255, 0.8);
}

#dice .cover, #dice .inner {
    background: #e8e8e8;
    box-shadow: none;
}

#dice .cover {
    border-radius: 0;
}

#dice .cover.x {
    transform: rotateY(90deg);
}

#dice .cover.z {
    transform: rotateX(90deg);
}

#dice .front {
    transform: translateZ(60px);
}

#dice .front.inner {
    transform: translateZ(59px);
}

#dice .back {
    transform: rotateX(-180deg) translateZ(60px);
}

#dice .back.inner {
    transform: rotateX(-180deg) translateZ(59px);
}

#dice .right {
    transform: rotateY(90deg) translateZ(60px);
}

#dice .right.inner {
    transform: rotateY(90deg) translateZ(59px);
}

#dice .left {
    transform: rotateY(-90deg) translateZ(60px);
}

#dice .left.inner {
    transform: rotateY(-90deg) translateZ(59px);
}

#dice .top {
    transform: rotateX(90deg) translateZ(60px);
}

#dice .top.inner {
    transform: rotateX(90deg) translateZ(59px);
}

#dice .bottom {
    transform: rotateX(-90deg) translateZ(60px);
}

#dice .bottom.inner {
    transform: rotateX(-90deg) translateZ(59px);
}

.dot {
    position: absolute;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: linear-gradient(135deg, #333, #111);
    box-shadow: inset 3px 0 8px #000,
                0 2px 5px rgba(0, 0, 0, 0.3);
}

.dot.center {
    margin: 48px 0 0 48px;
}

.dot.center.dleft {
    margin: 48px 0 0 15px;
}

.dot.center.dright {
    margin: 48px 0 0 81px;
}

.dot.dtop {
    margin-top: 15px;
}

.dot.dleft {
    margin-left: 81px;
}

.dot.dright {
    margin-left: 15px;
}

.dot.dbottom {
    margin-top: 81px;
}

.roll-btn {
    width: 100%;
    max-width: 300px;
    padding: 1.3rem 2rem;
    background: linear-gradient(135deg, #ffcc00, #ffaa00);
    color: black;
    font-size: 1.5rem;
    font-weight: 700;
    border-radius: 20px;
    border: none;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(255, 204, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.5);
    transition: all 0.3s ease;
    margin: 2rem auto 0;
    display: block;
}

.roll-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 30px rgba(255, 204, 0, 0.6);
}

.roll-btn:active {
    transform: translateY(-1px);
}

.roll-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
}

.creator-link {
    display: inline-block;
    margin-top: 2rem;
    padding: 1rem 2rem;
    background: linear-gradient(135deg, #25D366, #128C7E);
    color: white;
    font-size: 1.1rem;
    font-weight: 600;
    border-radius: 15px;
    text-decoration: none;
    box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
    transition: all 0.3s ease;
}

.creator-link:active {
    transform: scale(0.95);
}

@keyframes spin {
    0% {
        transform: translateZ(-100px) rotateX(0deg) rotateY(0deg) rotateZ(0deg);
    }
    16% {
        transform: translateZ(-100px) rotateX(180deg) rotateY(180deg) rotateZ(0deg);
    }
    33% {
        transform: translateZ(-100px) rotateX(360deg) rotateY(90deg) rotateZ(180deg);
    }
    50% {
        transform: translateZ(-100px) rotateX(360deg) rotateY(360deg) rotateZ(360deg);
    }
    66% {
        transform: translateZ(-100px) rotateX(180deg) rotateY(360deg) rotateZ(270deg);
    }
    83% {
        transform: translateZ(-100px) rotateX(270deg) rotateY(180deg) rotateZ(180deg);
    }
    100% {
        transform: translateZ(-100px) rotateX(360deg) rotateY(360deg) rotateZ(360deg);
    }
}

@keyframes roll {
    0% {
        transform: translate3d(0px, 0px, 0px);
    }
    30% {
        transform: translate3d(150px, -20px, 0px);
    }
    50% {
        transform: translate3d(0px, -50px, 0px);
    }
    80% {
        transform: translate3d(-150px, -20px, 0px);
    }
    100% {
        transform: translate3d(0px, 0px, 0px);
    }
}

@media (max-width: 768px) {
    h1 {
        font-size: 2.2rem;
    }
    
    #result {
        font-size: 3rem;
        padding: 1.2rem;
    }
    
    #dice {
        width: 100px;
        height: 100px;
    }
    
    .side {
        width: 100px;
        height: 100px;
    }
    
    .dot {
        width: 20px;
        height: 20px;
    }
    
    .dot.center {
        margin: 40px 0 0 40px;
    }
    
    .dot.center.dleft {
        margin: 40px 0 0 12px;
    }
    
    .dot.center.dright {
        margin: 40px 0 0 68px;
    }
    
    .dot.dtop {
        margin-top: 12px;
    }
    
    .dot.dleft {
        margin-left: 68px;
    }
    
    .dot.dright {
        margin-left: 12px;
    }
    
    .dot.dbottom {
        margin-top: 68px;
    }
    
    #dice .front, #dice .back, #dice .right, 
    #dice .left, #dice .top, #dice .bottom {
        transform-origin: center;
    }
    
    #dice .front {
        transform: translateZ(50px);
    }
    
    #dice .front.inner {
        transform: translateZ(49px);
    }
    
    #dice .back {
        transform: rotateX(-180deg) translateZ(50px);
    }
    
    #dice .back.inner {
        transform: rotateX(-180deg) translateZ(49px);
    }
    
    #dice .right {
        transform: rotateY(90deg) translateZ(50px);
    }
    
    #dice .right.inner {
        transform: rotateY(90deg) translateZ(49px);
    }
    
    #dice .left {
        transform: rotateY(-90deg) translateZ(50px);
    }
    
    #dice .left.inner {
        transform: rotateY(-90deg) translateZ(49px);
    }
    
    #dice .top {
        transform: rotateX(90deg) translateZ(50px);
    }
    
    #dice .top.inner {
        transform: rotateX(90deg) translateZ(49px);
    }
    
    #dice .bottom {
        transform: rotateX(-90deg) translateZ(50px);
    }
    
    #dice .bottom.inner {
        transform: rotateX(-90deg) translateZ(49px);
    }
}

@media (max-width: 480px) {
    .container {
        padding: 2rem 1rem;
    }
    
    h1 {
        font-size: 2rem;
        margin-bottom: 1.5rem;
    }
    
    #result {
        font-size: 2.5rem;
        padding: 1rem;
    }
    
    .roll-btn {
        font-size: 1.3rem;
        padding: 1.1rem 1.5rem;
    }
}
</style>
</head>
<body>

<div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
</div>

<a href="../index.html" class="volver-btn">⬅ Menú</a>

<div class="audio-control" onclick="toggleAudio()">
    <span id="audioIcon">🔊</span>
</div>

<div class="container">
    <h1>🎲 Dado 3D 🎲</h1>
    
    <div id="result">Lanza el dado</div>
    
    <div id="ui_dado">
        <div id="platform">
            <div id="dice" onclick="dado()">
                <div class="side front">
                    <div class="dot center"></div>
                </div>
                <div class="side front inner"></div>
                <div class="side top">
                    <div class="dot dtop dleft"></div>
                    <div class="dot dbottom dright"></div>
                </div>
                <div class="side top inner"></div>
                <div class="side right">
                    <div class="dot dtop dleft"></div>
                    <div class="dot center"></div>
                    <div class="dot dbottom dright"></div>
                </div>
                <div class="side right inner"></div>
                <div class="side left">
                    <div class="dot dtop dleft"></div>
                    <div class="dot dtop dright"></div>
                    <div class="dot dbottom dleft"></div>
                    <div class="dot dbottom dright"></div>
                </div>
                <div class="side left inner"></div>
                <div class="side bottom">
                    <div class="dot center"></div>
                    <div class="dot dtop dleft"></div>
                    <div class="dot dtop dright"></div>
                    <div class="dot dbottom dleft"></div>
                    <div class="dot dbottom dright"></div>
                </div>
                <div class="side bottom inner"></div>
                <div class="side back">
                    <div class="dot dtop dleft"></div>
                    <div class="dot dtop dright"></div>
                    <div class="dot dbottom dleft"></div>
                    <div class="dot dbottom dright"></div>
                    <div class="dot center dleft"></div>
                    <div class="dot center dright"></div>
                </div>
                <div class="side back inner"></div>
                <div class="side cover x"></div>
                <div class="side cover y"></div>
                <div class="side cover z"></div>
            </div>
        </div>
    </div>
    
    <button class="roll-btn" onclick="dado()" id="rollBtn">🎲 Lanzar Dado</button>
    
    <a href="https://wa.me/59175597503" target="_blank" class="creator-link">
        📱 Creador: Stalin Roldan
    </a>
</div>

<audio id="backgroundMusic" loop>
    <source src="../assets/audio/background.mp3" type="audio/mpeg">
</audio>
<audio id="sonidoDado">
    <source src="../assets/audio/dice.mp3" type="audio/mpeg">
</audio>

<script>
let audioEnabled = false;
let isRolling = false;

function toggleAudio() {
    audioEnabled = !audioEnabled;
    const icon = document.getElementById('audioIcon');
    const music = document.getElementById('backgroundMusic');
    
    icon.textContent = audioEnabled ? '🔊' : '🔇';
    
    if (audioEnabled) {
        music.play().catch(e => console.log('Audio blocked:', e));
    } else {
        music.pause();
    }
    
    localStorage.setItem('audioEnabled', audioEnabled);
}

function playSound(id) {
    if (!audioEnabled) return;
    const audio = document.getElementById(id);
    if (audio) {
        audio.currentTime = 0;
        audio.play().catch(e => console.log('Sound blocked:', e));
    }
}

function dado() {
    if (isRolling) return;
    
    isRolling = true;
    const platform = document.getElementById('platform');
    const dice = document.getElementById('dice');
    const resultEl = document.getElementById('result');
    const rollBtn = document.getElementById('rollBtn');
    
    rollBtn.disabled = true;
    resultEl.textContent = '🎲';
    playSound('sonidoDado');
    
    platform.classList.remove('stop');
    platform.classList.add('playing');
    
    setTimeout(function() {
        platform.classList.remove('playing');
        platform.classList.add('stop');
        
        const number = Math.floor(Math.random() * 6) + 1;
        let x = 0, y = 20, z = -20;
        
        switch(number) {
            case 1:
                x = 0; y = 20; z = -20;
                break;
            case 2:
                x = -100; y = -150; z = 10;
                break;
            case 3:
                x = 0; y = -100; z = -10;
                break;
            case 4:
                x = 0; y = 100; z = -10;
                break;
            case 5:
                x = 80; y = 120; z = -10;
                break;
            case 6:
                x = 0; y = 200; z = 10;
                break;
        }
        
        dice.style.transform = 'rotateX(' + x + 'deg) rotateY(' + y + 'deg) rotateZ(' + z + 'deg)';
        platform.style.transform = 'translate3d(0,0, 0px)';
        
        resultEl.textContent = '🎲 Resultado: ' + number;
        rollBtn.disabled = false;
        isRolling = false;
    }, 1400);
}

// Cargar estado del audio
window.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('audioEnabled');
    if (saved === 'true') {
        audioEnabled = true;
        document.getElementById('audioIcon').textContent = '🔊';
    }
});
</script>

</body>
</html>
