<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    min-height: 100vh;
    padding: 1rem;
    color: white;
    text-align: center;
    position: relative;
    overflow-x: hidden;
}

/* Partículas */
.particles {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    z-index: 0;
    pointer-events: none;
}

.particle {
    position: absolute;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 50%;
    animation: float 20s infinite ease-in-out;
}

.particle:nth-child(1) { width: 70px; height: 70px; left: 15%; animation-delay: 0s; }
.particle:nth-child(2) { width: 50px; height: 50px; left: 40%; animation-delay: 4s; }
.particle:nth-child(3) { width: 90px; height: 90px; left: 65%; animation-delay: 2s; }
.particle:nth-child(4) { width: 60px; height: 60px; left: 85%; animation-delay: 6s; }

@keyframes float {
    0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
    10% { opacity: 0.4; }
    90% { opacity: 0.4; }
    100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
}

/* Control de audio */
.audio-control {
    position: fixed;
    top: 15px;
    right: 15px;
    z-index: 1000;
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(10px);
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    width: 45px;
    height: 45px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
}

.audio-control:active {
    transform: scale(0.95);
}

.container {
    max-width: 600px;
    margin: 0 auto;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(20px);
    border-radius: 30px;
    padding: 2rem 1.5rem;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.2);
    position: relative;
    z-index: 1;
}

.volver-btn {
    display: inline-block;
    margin-bottom: 1rem;
    padding: 0.8rem 1.5rem;
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(10px);
    color: white;
    font-size: 1.1rem;
    font-weight: 600;
    border-radius: 15px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    transition: all 0.3s ease;
    text-decoration: none;
}

.volver-btn:active {
    transform: scale(0.95);
}

h1 {
    font-size: 2.3rem;
    margin: 1rem 0;
    color: #ffcc00;
    text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    font-weight: 700;
}

.timer-container {
    margin: 1.5rem 0;
    font-size: 2rem;
    font-weight: 700;
    color: #ffd700;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    padding: 1rem;
    background: rgba(0, 0, 0, 0.3);
    border-radius: 15px;
}

.timer-warning {
    color: #ff4444;
    animation: pulse 1s infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.7; transform: scale(1.08); }
}

.bottle-container {
    margin: 2.5rem auto;
    position: relative;
    width: 280px;
    height: 280px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.1), transparent);
    border-radius: 50%;
}

.bottle {
    font-size: 11rem;
    transform-style: preserve-3d;
    transition: transform 3s cubic-bezier(0.25, 1, 0.5, 1);
    filter: drop-shadow(0 0 30px rgba(255, 204, 0, 0.6));
    cursor: pointer;
    user-select: none;
}

.bottle.spinning {
    animation: spinBottle 3s ease-out;
}

@keyframes spinBottle {
    0% { transform: rotate(0deg) scale(1); }
    50% { transform: rotate(1800deg) scale(1.1); }
    100% { transform: rotate(var(--final-rotation, 2160deg)) scale(1); }
}

.girar-btn {
    display: block;
    margin: 2rem auto;
    padding: 1.3rem 2.5rem;
    background: linear-gradient(135deg, #ffcc00, #ffaa00);
    color: black;
    font-size: 1.6rem;
    font-weight: 700;
    border-radius: 20px;
    border: none;
    cursor: pointer;
    width: 90%;
    max-width: 350px;
    box-shadow: 0 8px 25px rgba(255, 204, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.5);
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
}

.girar-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
    transition: left 0.5s;
}

.girar-btn:hover::before {
    left: 100%;
}

.girar-btn:active {
    transform: scale(0.97);
    box-shadow: 0 4px 15px rgba(255, 204, 0, 0.4);
}

.girar-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
}

.reto-texto {

    margin: 2rem auto;

    display: flex;
    align-items: center;
    justify-content: center;

.creator-link {

    color: white;

function toggleAudio() {
    audioEnabled = !audioEnabled;
    const icon = document.getElementById('audioIcon');
    const music = document.getElementById('backgroundMusic');
    
    icon.textContent = audioEnabled ? '🔊' : '🔇';
    
    if (audioEnabled) {
        music.play().catch(e => console.log('Audio blocked:', e));
    } else {
        music.pause();
    }
    
    localStorage.setItem('audioEnabled', audioEnabled);
}

function playSound(id) {
    if (!audioEnabled) return;
    const audio = document.getElementById(id);
    if (audio) {
        audio.currentTime = 0;
        audio.play().catch(e => console.log('Sound blocked:', e));
    }
}

function girarBotella() {
    if (isSpinning) return;
    
    isSpinning = true;
    const botella = document.getElementById('bottle');
    const resultado = document.getElementById('resultado');
    const spinBtn = document.getElementById('spinBtn');
    
    spinBtn.disabled = true;
    playSound('sonidoGiro');
    
    // Reiniciar cronómetro
    if (window.__botella_timer) {
        window.__botella_timer.reiniciarCronometro();
    }
    
    // Animación de giro
    const vueltasCompletas = Math.floor(Math.random() * 4) + 6;
    const anguloFinal = Math.floor(Math.random() * 360);
    const rotacionTotal = (vueltasCompletas * 360 + anguloFinal);
    
    botella.style.setProperty('--final-rotation', `${rotacionTotal}deg`);
    botella.classList.remove('spinning');
    void botella.offsetWidth; // Forzar reflow
    botella.classList.add('spinning');
    
    // Seleccionar reto aleatorio
    const todosRetos = [].concat(
        categorias.picante.map(r => ({texto: r, nivel: "🌶️ Picante"})),
        categorias.divertido.map(r => ({texto: r, nivel: "😂 Divertido"})),
        categorias.romantico.map(r => ({texto: r, nivel: "💕 Romántico"})),
        categorias.psicologico.map(r => ({texto: r, nivel: "🧠 Psicológico"})),
        categorias.trago.map(r => ({texto: r, nivel: "🍺 Trago"})),
        categorias.reto.map(r => ({texto: r, nivel: "🎯 Reto"})),
        categorias.conocimiento.map(r => ({texto: r, nivel: "📚 Conocimiento"})),
        categorias.evento.map(r => ({texto: r, nivel: "🎉 Evento"}))
    );
    
    const retoAleatorio = todosRetos[Math.floor(Math.random() * todosRetos.length)];
    
    setTimeout(() => {
        resultado.innerHTML = `<strong>${retoAleatorio.nivel}</strong><br><br>${retoAleatorio.texto}`;
        playSound('sonidoPop');
        botella.style.transform = `rotate(${rotacionTotal}deg)`;
        botella.classList.remove('spinning');
        spinBtn.disabled = false;
        isSpinning = false;
    }, 3000);
}

// Cronómetro
(function(){
    let tiempo = 20;
    let intervalo = null;
    const timerEl = document.getElementById('timer');
    
    function actualizarDisplay(){ 
        if(timerEl) {
            timerEl.textContent = String(tiempo);
            if(tiempo <= 5 && tiempo > 0) {
                timerEl.classList.add('timer-warning');
            } else {
                timerEl.classList.remove('timer-warning');
            }
        }
    }
    
    function pararIntervalo(){ 
        if(intervalo) { 
            clearInterval(intervalo); 
            intervalo = null; 
        } 
    }
    
    function iniciarCuenta(){ 
        pararIntervalo(); 
        tiempo = 20; 
        actualizarDisplay(); 
        intervalo = setInterval(() => { 
            tiempo--; 
            actualizarDisplay();
            if(tiempo <= 0) {
                pararIntervalo();
                tiempo = 0;
                actualizarDisplay();
            }
        }, 1000); 
    }
    
    function reiniciarCronometro() {
        pararIntervalo();
        tiempo = 20;
        actualizarDisplay();
        iniciarCuenta();
    }
    
    window.__botella_timer = { iniciarCuenta, reiniciarCronometro };
})();

// Cargar estado del audio

    if (saved === 'true') {
        audioEnabled = true;
        document.getElementById('audioIcon').textContent = '🔊';
    }
