<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Juegos de Fiesta</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 1rem;
    position: relative;
    overflow-x: hidden;
}

/* Fondo animado con partículas */
.particles {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    z-index: 0;
    pointer-events: none;
}

.particle {
    position: absolute;
    background: rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    animation: float 15s infinite ease-in-out;
}

.particle:nth-child(1) { width: 80px; height: 80px; left: 10%; animation-delay: 0s; }
.particle:nth-child(2) { width: 60px; height: 60px; left: 20%; animation-delay: 2s; }
.particle:nth-child(3) { width: 100px; height: 100px; left: 35%; animation-delay: 4s; }
.particle:nth-child(4) { width: 50px; height: 50px; left: 50%; animation-delay: 1s; }
.particle:nth-child(5) { width: 90px; height: 90px; left: 70%; animation-delay: 3s; }
.particle:nth-child(6) { width: 70px; height: 70px; left: 85%; animation-delay: 5s; }

@keyframes float {
    0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
    10% { opacity: 0.6; }
    90% { opacity: 0.6; }
    100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
}

/* Control de audio */
.audio-control {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 1000;
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(10px);
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    width: 50px;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
}

.audio-control:hover {
    transform: scale(1.1);
    background: rgba(255, 255, 255, 0.3);
}

.audio-control:active {
    transform: scale(0.95);
}

.audio-icon {
    font-size: 24px;
    color: white;
    user-select: none;
}

.container {
    max-width: 500px;
    width: 100%;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(20px);
    border-radius: 30px;
    padding: 2.5rem 1.5rem;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.2);
    position: relative;
    z-index: 1;
    animation: fadeInUp 0.8s ease;
}

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

h1 {
    font-size: 2.8rem;
    margin-bottom: 0.5rem;
    color: #fff;
    text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5),
                 0 0 40px rgba(255, 204, 0, 0.5);
    animation: glow 2s ease-in-out infinite;
    font-weight: 700;
    letter-spacing: 1px;
}

@keyframes glow {
    0%, 100% { text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), 0 0 40px rgba(255, 204, 0, 0.5); }
    50% { text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), 0 0 60px rgba(255, 204, 0, 0.8); }
}

.subtitle {
    font-size: 1.3rem;
    margin-bottom: 2rem;
    color: rgba(255, 255, 255, 0.95);
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    font-weight: 500;
}

.menu-grid {
    display: grid;
    gap: 1.2rem;
    margin-bottom: 1.5rem;
}

.menu-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem 1.2rem;
    background: linear-gradient(135deg, rgba(255, 204, 0, 0.95), rgba(255, 170, 0, 0.95));
    color: #000;
    font-size: 1.5rem;
    font-weight: 700;
    border-radius: 20px;
    border: none;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(255, 204, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.5);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    text-decoration: none;
    position: relative;
    overflow: hidden;
}

.menu-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
    transition: left 0.5s;
}

.menu-btn:hover::before {
    left: 100%;
}

.menu-btn:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 30px rgba(255, 204, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.5);
}

.menu-btn:active {
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(255, 204, 0, 0.4);
}

.emoji {
    font-size: 2.2rem;
    margin-right: 12px;
    animation: bounce 2s infinite;
}

@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
}

.creator-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-top: 1.5rem;
    padding: 1rem 2rem;
    background: linear-gradient(135deg, #25D366, #128C7E);
    color: white;
    font-size: 1.2rem;
    font-weight: 600;
    border-radius: 15px;
    text-decoration: none;
    box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
    transition: all 0.3s ease;
    border: 1px solid rgba(255, 255, 255, 0.2);
}

.creator-link:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(37, 211, 102, 0.6);
}

.creator-link:active {
    transform: translateY(-1px);
}

/* Responsive */
@media (max-width: 768px) {
    .container {
        padding: 2rem 1.2rem;
    }
    
    h1 {
        font-size: 2.2rem;
    }
    
    .subtitle {
        font-size: 1.1rem;
    }
    
    .menu-btn {
        font-size: 1.3rem;
        padding: 1.3rem 1rem;
    }
    
    .emoji {
        font-size: 1.8rem;
    }
}

@media (max-width: 480px) {
    .container {
        padding: 1.8rem 1rem;
        border-radius: 25px;
    }
    
    h1 {
        font-size: 1.9rem;
    }
    
    .subtitle {
        font-size: 1rem;
        margin-bottom: 1.5rem;
    }
    
    .menu-btn {
        font-size: 1.2rem;
        padding: 1.2rem 0.9rem;
    }
    
    .emoji {
        font-size: 1.6rem;
        margin-right: 8px;
    }
    
    .creator-link {
        font-size: 1.1rem;
        padding: 0.9rem 1.5rem;
    }
    
    .audio-control {
        width: 45px;
        height: 45px;
        top: 15px;
        right: 15px;
    }
    
    .audio-icon {
        font-size: 20px;
    }
}

/* Animación de entrada para los botones */
.menu-btn:nth-child(1) { animation: fadeInUp 0.8s ease 0.1s both; }
.menu-btn:nth-child(2) { animation: fadeInUp 0.8s ease 0.2s both; }
.menu-btn:nth-child(3) { animation: fadeInUp 0.8s ease 0.3s both; }
</style>
</head>
<body>

<!-- Partículas de fondo -->
<div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
</div>

<!-- Control de audio -->
<div class="audio-control" onclick="toggleAudio()" id="audioControl">
    <span class="audio-icon" id="audioIcon">🔊</span>
</div>

<div class="container">
    <h1>🎉 Juegos de Fiesta 🥂</h1>
    <p class="subtitle">Elige tu juego favorito</p>
    
    <div class="menu-grid">
        <a href="Noche_de_Copas/index.html" class="menu-btn">
            <span class="emoji">🍻</span> Noche de Copas
        </a>
        
        <a href="Juego_de_la_Botella/index.html" class="menu-btn">
            <span class="emoji">🍾</span> Juego de la Botella
        </a>
        
        <a href="dado/index.html" class="menu-btn">
            <span class="emoji">🎲</span> Dado
        </a>
    </div>
    
    <a href="https://wa.me/59175597503" target="_blank" class="creator-link">
        📱 Creador: Stalin Roldan
    </a>
</div>

<!-- Audio de fondo -->
<audio id="backgroundMusic" loop>
    <source src="assets/audio/background.mp3" type="audio/mpeg">
</audio>

<script>
let audioEnabled = false;
const backgroundMusic = document.getElementById('backgroundMusic');
const audioControl = document.getElementById('audioControl');
const audioIcon = document.getElementById('audioIcon');

// Guardar estado del audio en localStorage
function saveAudioState() {
    localStorage.setItem('audioEnabled', audioEnabled);
}

function loadAudioState() {
    const savedState = localStorage.getItem('audioEnabled');
    if (savedState !== null) {
        audioEnabled = savedState === 'true';
        updateAudioIcon();
        if (audioEnabled) {
            playAudio();
        }
    }
}

function toggleAudio() {
    audioEnabled = !audioEnabled;
    
    if (audioEnabled) {
        playAudio();
    } else {
        backgroundMusic.pause();
    }
    
    updateAudioIcon();
    saveAudioState();
    
    // Animación del botón
    audioControl.style.transform = 'scale(0.9)';
    setTimeout(() => {
        audioControl.style.transform = 'scale(1)';
    }, 100);
}

function playAudio() {
    backgroundMusic.play().catch(e => {
        console.log('Audio play prevented:', e);
    });
}

function updateAudioIcon() {
    audioIcon.textContent = audioEnabled ? '🔊' : '🔇';
}

// Cargar estado al iniciar
loadAudioState();

// Intentar reproducir cuando el usuario interactúa
document.addEventListener('click', function initAudio() {
    if (audioEnabled && backgroundMusic.paused) {
        playAudio();
    }
}, { once: true });
</script>

</body>
</html>
