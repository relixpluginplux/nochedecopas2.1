* {

body {

/* Partículas de fondo */
.particles {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    z-index: 0;
    pointer-events: none;
}

.particle {
    position: absolute;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 50%;
    animation: float 20s infinite ease-in-out;
}

.particle:nth-child(1) { width: 60px; height: 60px; left: 10%; animation-delay: 0s; }
.particle:nth-child(2) { width: 80px; height: 80px; left: 30%; animation-delay: 3s; }
.particle:nth-child(3) { width: 50px; height: 50px; left: 50%; animation-delay: 6s; }
.particle:nth-child(4) { width: 70px; height: 70px; left: 70%; animation-delay: 2s; }
.particle:nth-child(5) { width: 90px; height: 90px; left: 85%; animation-delay: 5s; }

@keyframes float {
    0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
    10% { opacity: 0.5; }
    90% { opacity: 0.5; }
    100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
}

/* Control de audio */
.audio-control {
    position: fixed;
    top: 15px;
    right: 15px;
    z-index: 1000;
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(10px);
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    width: 45px;
    height: 45px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
}

.audio-control:active {
    transform: scale(0.95);
}

.container {

    margin: 0 auto;
    position: relative;
    z-index: 1;
}

}

.btn {

.btn-primary {

.btn-secondary {

function toggleAudio() {
    audioEnabled = !audioEnabled;
    const icon = document.getElementById('audioIcon');
    const music = document.getElementById('backgroundMusic');
    
    icon.textContent = audioEnabled ? '🔊' : '🔇';
    
    if (audioEnabled) {
        music.play().catch(e => console.log('Audio blocked:', e));
    } else {
        music.pause();
    }
    
    localStorage.setItem('audioEnabled', audioEnabled);
}

function playSound(id) {
    if (!audioEnabled) return;
    const audio = document.getElementById(id);
    if (audio) {
        audio.currentTime = 0;
        audio.play().catch(e => console.log('Sound blocked:', e));
    }
}

function agregarJugador() {
    const input = document.getElementById("jugador");
    const nombre = input.value.trim();
    
    if (!nombre) {
        alert("Escribe un nombre");
        return;
    }
    
    if (jugadores.length >= 30) {
        alert("Máximo 30 jugadores");
        return;
    }
    
    if (jugadores.includes(nombre)) {
        alert("Este jugador ya existe");
        return;
    }
    
    jugadores.push(nombre);
    puntajes[nombre] = 0;
    actualizarListaJugadores();
    input.value = '';
    playSound("sonidoAgregar");
}

function actualizarListaJugadores() {
    const lista = document.getElementById("jugadores-lista");
    if (jugadores.length === 0) {
        lista.innerHTML = '<em style="opacity:0.7">No hay jugadores todavía...</em>';
    } else {
        lista.textContent = "Jugadores: " + jugadores.join(", ");
    }
}

function resetearJuego() {
    if (jugadores.length > 0 && !confirm("¿Estás seguro de resetear todo?")) {
        return;
    }
    
    jugadores = [];
    puntajes = {};
    indiceJugador = 0;
    indiceActual = 0;
    retosPorJugador = {};
    
    actualizarListaJugadores();
    document.getElementById("reto").textContent = "Configura el juego y presiona 'Comenzar Partida'";
    document.getElementById("nivel").textContent = "";
    document.getElementById("marcador").textContent = "";
    
    if (window.__noche_timer) {
        window.__noche_timer.detenerYResetear();
    }
}

function iniciarPartida() {
    if (jugadores.length === 0) {
        alert("Agrega al menos un jugador");
        return;
    }
    
    const cantidad = parseInt(document.getElementById("cantidad").value);
    const todosRetos = [].concat(
        categorias.picante.map(r => ({texto: r, nivel: "🌶️ Picante"})),
        categorias.divertido.map(r => ({texto: r, nivel: "😂 Divertido"})),
        categorias.romantico.map(r => ({texto: r, nivel: "💕 Romántico"})),
        categorias.psicologico.map(r => ({texto: r, nivel: "🧠 Psicológico"})),
        categorias.trago.map(r => ({texto: r, nivel: "🍺 Trago"})),
        categorias.reto.map(r => ({texto: r, nivel: "🎯 Reto"})),
        categorias.conocimiento.map(r => ({texto: r, nivel: "📚 Conocimiento"})),
        categorias.evento.map(r => ({texto: r, nivel: "🎉 Evento"}))
    );

    for (let j of jugadores) {
        retosPorJugador[j] = [...todosRetos].sort(() => 0.5 - Math.random()).slice(0, cantidad);
    }
    
    indiceActual = 0;
    indiceJugador = 0;
    mostrarReto();
    
    if (window.__noche_timer) {
        window.__noche_timer.iniciarCuenta();
    }
}

    const jugador = jugadores[indiceJugador];
    puntajes[jugador]++;
    playSound("sonidoCumplio");
    avanzarTurno();
}

function noCumplioReto() {
    playSound("sonidoNoCumplio");
    avanzarTurno();
}

function avanzarTurno() {
    indiceJugador = (indiceJugador + 1) % jugadores.length;
    if (indiceJugador === 0) {
        indiceActual++;
    }
    mostrarReto();
    mostrarMarcador();
    playSound("sonidoBoton");
}

function mostrarMarcador() {
    let texto = "📊 Puntajes:\n";
    for (let j of jugadores) {
        texto += `${j}: ${puntajes[j]} puntos\n`;
    }
    document.getElementById("marcador").textContent = texto;
}

function mostrarGanador() {
    const maxPuntos = Math.max(...Object.values(puntajes));
    const minPuntos = Math.min(...Object.values(puntajes));
    const ganadores = jugadores.filter(j => puntajes[j] === maxPuntos);
    const perdedores = jugadores.filter(j => puntajes[j] === minPuntos);
    
    let mensaje = "🎉 ¡FIN DEL JUEGO! 🎉\n\n";
    mensaje += `🏆 Ganador(es): ${ganadores.join(", ")}\n`;
    mensaje += `Con ${maxPuntos} punto(s)\n\n`;
    mensaje += `🍻 Beben 3 tragos: ${perdedores.join(", ")}`;
    
    document.getElementById("reto").textContent = mensaje;
    document.getElementById("nivel").textContent = "";
    
    if (window.__noche_timer) {
        window.__noche_timer.detenerYResetear();
    }
}

// Cronómetro
(function(){
    let tiempo = 20;
    let intervalo = null;
    const timerEl = document.getElementById('timer');
    
    function actualizarDisplay(){ 
        if(timerEl) {
            timerEl.textContent = String(tiempo);
            if(tiempo <= 5 && tiempo > 0) {
                timerEl.classList.add('timer-warning');
            } else {
                timerEl.classList.remove('timer-warning');
            }
        }
    }
    
    function pararIntervalo(){ 
        if(intervalo) { 
            clearInterval(intervalo); 
            intervalo = null; 
        } 
    }
    
    function iniciarCuenta(){ 
        pararIntervalo(); 
        tiempo = 20; 
        actualizarDisplay(); 
        intervalo = setInterval(() => { 
            tiempo--; 
            actualizarDisplay();
            if(tiempo <= 0) {
                pararIntervalo();
                tiempo = 0;
                actualizarDisplay();
            }
        }, 1000); 
    }
    
    function reiniciarCronometro() {
        pararIntervalo();
        tiempo = 20;
        actualizarDisplay();
        iniciarCuenta();
    }
    
    function detenerYResetear() {
        pararIntervalo();
        tiempo = 0;
        actualizarDisplay();
    }
    
    const origCumplio = window.cumplioReto;
    window.cumplioReto = function(){ 
        origCumplio(); 
        reiniciarCronometro();
    };
    
    const origNoCumplio = window.noCumplioReto;
    window.noCumplioReto = function(){ 
        origNoCumplio(); 
        reiniciarCronometro();
    };

    window.__noche_timer = { iniciarCuenta, reiniciarCronometro, detenerYResetear };
})();
